<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 256 256" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Personal Josy — logotipo aprovado em Poppins, fundo transparente</title>
  <desc id="descricao">Logotipo aprovado: Personal branco na linha superior e Josy amarelo, maior, logo abaixo. As duas palavras têm a mesma largura visual, com letras proporcionais de Poppins Bold 700 convertidas em caminhos. Sem fundo incorporado, contorno, sombra ou animação.</desc>
  <metadata>
    Fonte: Poppins Bold, peso 700, palavras Personal e Josy.
    Origem: https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Bold.ttf
    SHA256 da fonte: 983676516167748B74DE6F4771FB384C664FD913ACB8B471122ECACF5DA5EA6C
    Copyright 2020 The Poppins Project Authors (https://github.com/itfoundry/Poppins).
    Fonte licenciada sob SIL Open Font License 1.1:
    https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/OFL.txt
    Contornos extraídos por GlyphTypeface do Windows, sem instalação da fonte.
    Cada palavra foi escalada uniformemente para 200 unidades de largura visual.
    Margens laterais: 28 unidades. Intervalo vertical entre palavras: 12 unidades.
    Bloco centralizado na prancheta quadrada; Josy tem tamanho de fonte aproximadamente 1.844 vez maior.
    Coordenadas arredondadas a três casas decimais. Sem fonte incorporada ou dependência externa.
    Logotipo aprovado em 2026-10-16. Versão com fundo transparente; substitui os monogramas PJ.
  </metadata>
