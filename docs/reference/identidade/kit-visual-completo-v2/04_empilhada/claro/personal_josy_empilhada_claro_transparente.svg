<title id="title">Personal Josy — Empilhada — aplicação claro</title>
<desc id="desc">Personal Josy. Calendário amarelo; J preenchido em #202020 opaco; presilhas escuras. Josy amarelo com contorno escuro equilibrado: opção B.</desc>
